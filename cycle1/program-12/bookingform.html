<docttype html>
<html>
<head>
	<title>Booking form</title>
</head>
<body style="text-align:center;">
<form>
	<h2>BOOKING FORM</h2><br>
	Guest name: <br><input type="text" name="name" required><br><br>
	Email:<br>  <input type=text" name=email"><br><br>
	Phone: <br> <input type="text" name=phone"><br><br>
	check-in date:  <input type="date" name="check-in-date"><br><br>
	Check-out date:  <input type="date" name="check-out-date"><br><br>
	Number of guest: <br> <input type="text" name="no_of_guest"><br><br>
	Room type: 
		<select>
		<option selected disabled>choose</option> 
		<option>Deluxe Room</option>
		<option>Family Room</option>
		<option>Suite</option>
		</select><br><br>
	Gender: <input type="radio" name="gender">Male
		<input type="radio" name="gender">Female<br><br>
	Facilities required:
		<input type="checkbox">AC 
		<input type="checkbox">TV
		<input type="checkbox">WI-FI
		<input type="checkbox">BAR <br><br>
	Special request: <textarea rows="5" cols="30"></textarea><br><br>
	<input type="submit" value="book-now">
	<input type="Reset" value="reset">
</form>
</body>
</html>
