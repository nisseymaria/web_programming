<!docttype html>
<html>
<head>
	<title>survey form</title>
</head>
<body>
	<h2>SURVEY FORM</h2><br>
	<form>
	Respondent's Name: <br>
	<input type="text" name="name" required><br><br>
	Age: <br>
	<input type="text" name="age"><br><br>
	Gender: <br>
	<input type="radio" name="g">male
		<input type="radio" name="g">female <br><br>
	Favorite activity: <br>
	 <select name="activity">
		<option>Social Media</option>
		<option>News</option>
		<option>Shopping</option>
		<option>Gameing</option>
	</select><br><br>
	Device used: <br>
	<input type="checkbox">Phone
	<input type="checkbox">Tablet
	<input type="checkbox">Laptop<br><br>
	General comment: <br>
	 <textarea rows="5" cols="30"></textarea><br><br>
	<input type="submit" value="submit">
	<input type="reset" value="reset">
	</form>
</body>
</html>
