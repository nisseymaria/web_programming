<!docttype html>
<html>
<head>
	<title>survey form</title>
</head>
<body>
	<h2>SURVEY FORM</h2>
	<form>
	Name: <input type="text" name="name" required><br><br>
	Age: <input type="text" name="age"><br><br>
	Gender: <input type="radio" name="g">male
		<input type="radio" name="g">female
	Favorite activity <select name="activity">
		<option>Social Media</option>
		<option>News</option>
		<option>Shopping</option>
		<option>Gameing</option>
	</select><br><br>
	Device used: <input type="checkbox">Phone
	<input type="checkbox">Tablet
	<input type="checkbox">Laptop<br><br>
	General comment: <textarea rows="4" cols="3"</textarea><br><br>
	<input type="submit" name="submit">
	<input type="reset" name="reset">
	</form>
</body>
</html>
