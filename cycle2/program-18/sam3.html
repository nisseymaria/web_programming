<html>
<head>
	<title>js</title>
</head>
<body>
	<p id="n1">75</p>
	<p id="n2">91</p>
	<p id="result">98</p>
<script>
	let a=Number(document.getElementById('n1').textContent);
	let b=Number(document.getElementById('n2').textContent);
	let sum=a+b;
	document.getElementById("result").textContent="sum"+sum;
</script>
</body>
</html>
